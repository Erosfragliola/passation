name = "passation"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Base créée à l'étape 8 (npx wrangler d1 create passation) : remplacer l'identifiant ci-dessous.
# En local, wrangler dev utilise une base SQLite locale, l'identifiant n'a pas besoin d'exister.
[[d1_databases]]
binding = "DB"
database_name = "passation"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "passation-fichiers"

[vars]
APP_NAME = "Passation"
