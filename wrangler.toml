name = "passation"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
# Pages go through the Worker: their texts come from src/contenu/<language>/*.json, French under /fr/
# (src/routes/pages.js, which also serves the translated 404 page). Static resources are served directly.
run_worker_first = ["/*", "!/css/*", "!/js/*", "!/img/*", "!/fonts/*", "!/video/*"]

# Production D1 database created on 10/11/2026 (npx wrangler d1 create passation).
# Locally, wrangler dev uses a local SQLite copy of this database.
[[d1_databases]]
binding = "DB"
database_name = "passation"
database_id = "a33eabb7-625c-41a7-bc47-5a682e276fe6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "passation-fichiers"

# Daily reminder (8 a.m. UTC) for files left unfinished for 3 days: a single reminder per file.
[triggers]
crons = ["0 8 * * *"]

[vars]
APP_NAME = "Passation"
