name = "passation"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Base D1 de production créée le 10/11/2026 (npx wrangler d1 create passation).
# En local, wrangler dev utilise une copie SQLite locale de cette base.
[[d1_databases]]
binding = "DB"
database_name = "passation"
database_id = "a33eabb7-625c-41a7-bc47-5a682e276fe6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "passation-fichiers"

[vars]
APP_NAME = "Passation"
