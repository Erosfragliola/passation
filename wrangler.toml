name = "passation"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
# Les pages passent par le Worker : leurs textes viennent de src/contenu/<langue>/*.json, le français sous /fr/
# (src/routes/pages.js, qui sert aussi la page 404 traduite). Les ressources statiques sont servies directement.
run_worker_first = ["/*", "!/css/*", "!/js/*", "!/img/*", "!/fonts/*", "!/video/*"]

# Base D1 de production créée le 10/11/2026 (npx wrangler d1 create passation).
# En local, wrangler dev utilise une copie SQLite locale de cette base.
[[d1_databases]]
binding = "DB"
database_name = "passation"
database_id = "a33eabb7-625c-41a7-bc47-5a682e276fe6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "passation-fichiers"

# Rappel quotidien (8 h UTC) des dossiers interrompus depuis 3 jours : un seul rappel par dossier.
[triggers]
crons = ["0 8 * * *"]

[vars]
APP_NAME = "Passation"
