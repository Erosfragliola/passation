<!doctype html>
<html lang="fr" class="sans-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t-html="commun.titres.dossier"></title>
  <meta name="theme-color" content="#FBF6EC">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/espace-bento.css">
</head>
<body class="page-dossier page-espace">
<a class="lien-evitement" href="#contenu" data-t-html="commun.nav.evitement"></a>
<header class="nav-zone">
  <nav class="nav" data-t-attr="aria-label=commun.nav.principale">
    <a class="logo" href="/" data-t-attr="aria-label=commun.nav.accueil"><svg class="logo-symbole" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 27h22" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="21" r="2.6" fill="#A8653A"/></svg>Passation</a>
    <div class="nav-actions"><a class="btn btn-contour" id="lien-dossier" href="/espace/" aria-current="page" data-t-html="commun.nav.mon_dossier"></a><button class="btn btn-contour" type="button" id="btn-deconnexion" data-t-html="commun.nav.deconnexion"></button><div class="langues" role="group" data-t-attr="aria-label=commun.langues.choisir"><a data-langue="en" hreflang="en" lang="en" data-t-attr="title=commun.langues.en">EN</a><span class="langues-sep" aria-hidden="true">|</span><a data-langue="fr" hreflang="fr" lang="fr" data-t-attr="title=commun.langues.fr">FR</a></div></div>
  </nav>
</header>
<main id="contenu" class="espace espace-bento dossier-parcours" aria-busy="true">
  <div class="conteneur dossier-leger">
    <ol class="fil-leger" id="fil" data-t-attr="aria-label=votre_parcours"></ol>
    <div class="bandeau-etape" id="bandeau-etape" role="status" hidden><p id="bandeau-texte"></p><a class="btn btn-noir btn-mini" id="bandeau-lien" href="#"></a></div>

    <div class="dossier-tete">
      <section class="tuile tuile-vert tuile-dossier" aria-labelledby="dossier-nom">
        <p class="nom-code" id="nom-code"></p>
        <h1 class="affiche" id="dossier-nom" data-t-html="commun.chargement"></h1>
        <div class="dossier-valeur">
          <p class="valeur-etiquette" id="valeur-etiquette" data-t-html="valorisation"></p>
          <p class="valeur-montant" id="valeur-montant">–</p>
          <p class="valeur-base"><span id="valeur-base"></span> <a class="valeur-lien" id="valeur-lien" href="/espace/valorisation/"></a></p>
          <p class="valeur-ecart" id="valeur-ecart" hidden></p>
        </div>
      </section>

      <div class="dossier-action">
        <section class="tuile action-principale" aria-labelledby="action-titre">
          <span class="etat" id="action-etat" hidden></span>
          <h2 id="action-titre"></h2>
          <p class="petit" id="action-detail"></p>
          <a class="btn btn-principal" id="cta" href="/espace/demarrer/" data-t-html="continuer"></a>
        </section>
        <section class="tuile taches-secondaires" id="secondaires" aria-labelledby="titre-secondaires" hidden>
          <h2 id="titre-secondaires"></h2>
          <ul class="taches-liste" id="afaire"></ul>
        </section>
      </div>
    </div>

    <h2 class="titre-sobre" id="titre-docs" data-t-html="commun.documents.vos_documents"></h2>
    <div class="docs-rangee" id="docs"></div>

    <div class="bento-espace">
      <section class="tuile pieces-zone" id="checklist" aria-labelledby="titre-pieces">
        <div class="pieces-resume">
          <h2 id="titre-pieces" class="affiche" data-t-html="pieces_reunir"></h2>
          <div class="pieces-compte"><strong id="checklist-compte"></strong><span class="jauge-pieces" aria-hidden="true"><span id="jauge-pieces"></span></span></div>
          <button class="btn btn-contour" type="button" id="pieces-bouton" aria-expanded="false" aria-controls="pieces-depot" data-t-html="ouvrir_depot"></button>
        </div>
        <div class="pieces-depot" id="pieces-depot" hidden>
          <p class="petit" data-t-html="documents_habituellement_demandes_lors_audit"></p>
          <div class="drive">
            <div class="drive-dossiers" id="drive-dossiers" role="tablist" data-t-attr="aria-label=themes"></div>
            <div class="drive-contenu" id="checklist-groupes" role="tabpanel" tabindex="0"></div>
          </div>
        </div>
      </section>
    </div>

    <details class="gerer-dossier">
      <summary data-t-html="gerer_mon_dossier"></summary>
      <p class="petit" data-t-html="suppression_efface_definitivement_dossier_vos"></p>
      <button class="btn btn-danger" type="button" id="btn-supprimer" data-t-html="supprimer_mon_dossier"></button>
    </details>
  </div>

  <div class="cta-tel" data-t-html="continuer_2"></div>

  <dialog id="dialog-supprimer" aria-labelledby="titre-supprimer">
    <h2 id="titre-supprimer" data-t-html="supprimer_dossier"></h2>
    <p data-t-html="toutes_ses_donnees_tous_ses"></p>
    <div class="dialog-actions">
      <button class="btn btn-contour" type="button" id="annuler-supprimer" data-t-html="annuler"></button>
      <button class="btn btn-danger" type="button" id="confirmer-supprimer" data-t-html="supprimer_definitivement"></button>
    </div>
  </dialog>
  <p class="message-carte" id="espace-message" role="status" hidden></p>
</main>
<footer class="pied">
  <div class="conteneur pied-bas petit" style="margin-top:0;border-top:0;padding-top:0" data-t-html="commun.pied.simple"></div>
</footer>
<script src="/js/site.js" defer></script>
<script type="module" src="/js/barre-espace.js"></script>
<script type="module" src="/js/espace.js"></script>
</body>
</html>
