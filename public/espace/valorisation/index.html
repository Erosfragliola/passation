<!doctype html>
<html lang="fr" class="sans-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t-html="valorisation_passation"></title>
  <meta name="theme-color" content="#FBF6EC">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/espace-bento.css">
</head>
<body class="page-espace">
<a class="lien-evitement" href="#contenu" data-t-html="commun.nav.evitement"></a>
<header class="nav-zone">
  <nav class="nav" data-t-attr="aria-label=commun.nav.principale">
    <a class="logo" href="/" data-t-attr="aria-label=commun.nav.accueil"><svg class="logo-symbole" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 27h22" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="21" r="2.6" fill="#A8653A"/></svg>Passation</a>
    <div class="nav-actions"><a class="btn btn-contour" id="lien-dossier" href="/espace/" data-t-html="commun.nav.mon_dossier"></a><button class="btn btn-contour" type="button" id="btn-deconnexion" data-t-html="commun.nav.deconnexion"></button><div class="langues" role="group" data-t-attr="aria-label=commun.langues.choisir"><a data-langue="en" hreflang="en" lang="en" data-t-attr="title=commun.langues.en">EN</a><span class="langues-sep" aria-hidden="true">|</span><a data-langue="fr" hreflang="fr" lang="fr" data-t-attr="title=commun.langues.fr">FR</a></div></div>
  </nav>
</header>
<main id="contenu" class="espace espace-bento parcours" aria-busy="true">
  <section class="espace-tete">
    <div class="conteneur">
      <nav class="ariane pas-imprime" data-t-html="mon_dossier_valorisation" data-t-attr="aria-label=commun.nav.ariane"></nav>
      <h1 class="affiche" id="dossier-nom" data-t-html="commun.chargement"></h1>
      <!-- Onglets de la page (non numérotés) : le fil du parcours est celui de la page du dossier -->
      <nav class="etapes onglets" data-t-html="vos_chiffres_pour_aller_plus" data-t-attr="aria-label=sections_page"></nav>
    </div>
  </section>

  <!-- 1. Vos chiffres -->
  <section class="panneau" id="chiffres" aria-labelledby="titre-chiffres" hidden>
    <div class="conteneur">
      <h2 id="titre-chiffres" tabindex="-1" data-t-html="vos_chiffres"></h2>
      <p class="chapo-petit" data-t-html="detail_vos_comptes_ligne_par"></p>
      <div class="chiffres-barre">
        <div class="choix-annee" id="choix-annee" role="group" data-t-attr="aria-label=exercice_affiche"></div>
        <div class="chiffres-outils">
          <label class="visuellement-cache" for="nouvel-exercice" data-t-html="annee_exercice_ajouter"></label>
          <input id="nouvel-exercice" type="number" min="1990" max="2100" step="1" placeholder="2025" inputmode="numeric">
          <button class="btn btn-contour btn-petit" type="button" id="btn-exercice" data-t-html="ajouter_exercice"></button>
          <span class="depot depot-compact" id="depot"><input type="file" id="fichier-liasse" accept="application/pdf" hidden><button class="btn btn-noir btn-petit" type="button" id="btn-liasse" data-t-html="lire_liasse_pdf" data-t-attr="title=formulaires_2033_ou_2050_2059"></button></span>
        </div>
      </div>
      <p class="message-carte" id="message-liasse" role="status" aria-live="polite" hidden></p>
      <div id="chiffres-annee" aria-live="polite"></div>
    </div>
  </section>

  <!-- 2. Votre entreprise -->
  <section class="panneau" id="entreprise" aria-labelledby="titre-entreprise" hidden>
    <div class="conteneur conteneur-moyen">
      <h2 id="titre-entreprise" data-t-html="pour_aller_plus_loin"></h2>
      <p class="chapo-petit" data-t-html="questions_facultatives_elles_ne_comptent"></p>
      <ol class="sous-etapes" id="sous-etapes"></ol>
      <form class="form-carte questionnaire" id="questionnaire" novalidate></form>
      <p class="petit enregistre" id="etat-enregistrement" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- 3. Votre valorisation -->
  <section class="panneau" id="valorisation" aria-labelledby="titre-valorisation" hidden>
    <div class="conteneur">
      <h2 id="titre-valorisation" data-t-html="votre_valorisation"></h2>
      <div id="resultat" aria-live="polite"></div>
    </div>
  </section>
  <p class="message-carte" id="parcours-message" role="status" hidden></p>
</main>
<footer class="pied">
  <div class="conteneur pied-bas petit" style="margin-top:0;border-top:0;padding-top:0" data-t-html="commun.pied.simple"></div>
</footer>
<script src="/js/site.js" defer></script>
<script type="module" src="/js/barre-espace.js"></script>
<script type="module" src="/js/valorisation.js"></script>
</body>
</html>
