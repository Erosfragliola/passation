<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title data-t="meta.titre">Passation</title>
  <meta name="description" data-t-attr="content=meta.description">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Passation">
  <meta property="og:title" data-t-attr="content=meta.partage_titre">
  <meta property="og:description" data-t-attr="content=meta.description">
  <meta property="og:image" content="/img/partage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="/img/photos/hero-poster-1600.webp" imagesrcset="/img/photos/hero-poster-800.webp 800w, /img/photos/hero-poster-1600.webp 1600w, /img/photos/hero-poster-2400.webp 2400w" imagesizes="100vw" fetchpriority="high">

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/landing.css">
</head>
<body class="landing">
<!-- Intro (première visite) : le seuil du logo se dessine, la porte s'allume, on entre. public/js/landing/intro.js -->
<div class="intro" id="intro">
  <svg class="intro-svg" aria-hidden="true" focusable="false">
    <defs>
      <mask id="intro-masque" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
        <rect width="100%" height="100%" fill="#fff"/>
        <g class="intro-zoom"><path class="intro-trou" d="M9 27V15a7 7 0 0 1 14 0v12z" fill="#000" opacity="0"/></g>
      </mask>
      <radialGradient id="intro-lueur" cx="50%" cy="70%" r="65%"><stop offset="0" stop-color="#F6DDBB"/><stop offset="1" stop-color="#C9894F"/></radialGradient>
    </defs>
    <rect class="intro-fond" width="100%" height="100%" mask="url(#intro-masque)"/>
    <g class="intro-zoom">
      <path class="intro-porte" d="M9 27V15a7 7 0 0 1 14 0v12z" fill="url(#intro-lueur)" opacity="0"/>
      <path class="intro-trait" d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke="#FBF6EC" stroke-width="1.1" stroke-linecap="round"/>
      <path class="intro-trait" d="M5 27h22" fill="none" stroke="#FBF6EC" stroke-width="1.1" stroke-linecap="round"/>
      <circle class="intro-point" cx="16" cy="21" r="2.4" fill="#A8653A" opacity="0"/>
    </g>
  </svg>
  <span class="intro-nom" aria-hidden="true">Passation</span>
  <button class="intro-passer" type="button"><span data-t="intro.passer"></span> <span aria-hidden="true">›</span></button>
</div>
<a class="lien-evitement" href="#contenu" data-t="nav.evitement">Aller au contenu</a>

<header class="nav-zone">
  <nav class="nav" data-t-attr="aria-label=nav.principale">
    <a class="logo" href="/" data-t-attr="aria-label=nav.accueil"><svg class="logo-symbole" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 27h22" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="21" r="2.6" fill="#A8653A"/></svg>Passation</a>
    <div class="nav-centre">
      <ul class="nav-liens">
        <li><a href="#comment" data-t="nav.comment"></a></li>
        <li data-si="prix_dossier"><a href="#tarifs" data-t="nav.tarifs"></a></li>
        <li><a href="#confidentialite" data-t="nav.confidentialite"></a></li>
        <li><a href="#questions" data-t="nav.questions"></a></li>
      </ul>
      <form class="nav-champ recherche-mini" action="/connexion" method="get" data-champ-siren="nav" data-zone-champ>
        <label class="visuellement-cache" for="q-nav" data-t="champ.libelle"></label>
        <input id="q-nav" name="q" type="search" autocomplete="off" data-t-attr="placeholder=champ.libelle"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-nav">
        <button class="btn btn-vert" type="submit"><span data-t="champ.bouton_court"></span> <span class="fleche" aria-hidden="true">→</span></button>
        <ul class="suggestions" id="suggestions-nav" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
        <p class="recherche-message" id="message-nav" role="status" data-message hidden></p>
      </form>
    </div>
    <div class="nav-actions">
      <a class="btn btn-noir btn-espace" href="/connexion" data-connexion data-t="nav.espace"></a>
      <button class="nav-bouton" type="button" aria-expanded="false" aria-controls="nav-mobile" data-t-attr="aria-label=nav.menu_ouvrir">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h14M2 9h14M2 13h14"/></svg>
      </button>
    </div>
  </nav>
  <div class="nav-mobile" id="nav-mobile" hidden>
    <a href="#comment" data-t="nav.comment"></a>
    <a href="#tarifs" data-si="prix_dossier" data-t="nav.tarifs"></a>
    <a href="#confidentialite" data-t="nav.confidentialite"></a>
    <a href="#questions" data-t="nav.questions"></a>
    <a href="/connexion" data-connexion data-t="nav.espace"></a>
  </div>
</header>

<main id="contenu">

  <!-- 1. Hero : agir -->
  <section id="accueil" class="hero" aria-labelledby="titre-hero">
    <div class="hero-fond">
      <img src="/img/photos/hero-poster-1600.webp"
           srcset="/img/photos/hero-poster-800.webp 800w, /img/photos/hero-poster-1600.webp 1600w, /img/photos/hero-poster-2400.webp 2400w"
           sizes="100vw" alt="" width="2400" height="1266" fetchpriority="high">
      <!-- Vidéos (public/js/landing/video.js) : clips des métiers en alternance, ou la vidéo actuelle tant que la
           liste est vide ; jamais avec « réduire les animations » ni en économie de données -->
      <div class="hero-videos" data-sources-hd='[["/video/hero-1080.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'
           data-sources-uhd='[["/video/hero-2160.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'>
        <video class="hero-video" muted playsinline preload="none" aria-hidden="true" hidden></video>
        <video class="hero-video" muted playsinline preload="none" aria-hidden="true" hidden></video>
      </div>
    </div>
    <p class="hero-metier" aria-hidden="true" hidden></p>
    <button class="hero-pause" type="button" hidden>
      <svg class="icone-pause" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3h3v12H5zM10 3h3v12h-3z" fill="currentColor"/></svg>
      <svg class="icone-lecture" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3l10 6-10 6z" fill="currentColor"/></svg>
      <span class="visuellement-cache"></span>
    </button>
    <div class="conteneur hero-contenu">
      <p class="surtitre" data-t="hero.surtitre"></p>
      <h1 id="titre-hero" data-t="hero.titre"></h1>
      <p class="chapo" data-t="hero.sous_titre"></p>
      <form class="recherche" action="/connexion" method="get" role="search" data-champ-siren="accueil" data-t-attr="aria-label=champ.zone">
        <div class="recherche-champ">
          <label for="q" data-t="champ.libelle"></label>
          <input id="q" name="q" type="search" autocomplete="off" required minlength="3" aria-describedby="note-recherche"
                 data-t-attr="placeholder=champ.libelle"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
          <button class="btn btn-vert" type="submit"><span data-t="champ.bouton"></span> <span class="fleche" aria-hidden="true">→</span></button>
        </div>
        <ul class="suggestions" id="suggestions" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
        <p class="recherche-message" id="recherche-message" role="status" data-message hidden></p>
        <div class="recherche-note" id="note-recherche">
          <p data-t="hero.note"></p>
          <p data-t="hero.note_comptes"></p>
        </div>
      </form>
    </div>
  </section>

  <!-- Résultat de l'estimation (provisoire : l'écran du nom de code arrive en phase 7) -->
  <section id="resultat" class="resultat" aria-labelledby="titre-resultat" hidden>
    <div class="conteneur">
      <div class="resultat-carte" aria-live="polite">
        <p class="surtitre" data-t="js.resultat.titre"></p>
        <h2 id="titre-resultat" class="resultat-nom"></h2>
        <div id="resultat-estimation" hidden>
          <p class="petit" id="estimation-legende"></p>
          <p class="estimation-valeur chiffre" id="estimation-valeur"></p>
          <p class="resultat-note" id="estimation-note"></p>
          <p class="petit" id="estimation-methodes"></p>
        </div>
        <form id="form-comptes" class="form-comptes" hidden>
          <p data-t="js.resultat.confidentiels"></p>
          <label><span data-t="js.resultat.ca"></span><input id="saisie-ca" type="number" inputmode="numeric" min="1" step="1" required></label>
          <label><span data-t="js.resultat.ebe"></span><input id="saisie-ebe" type="number" inputmode="numeric" step="1" required></label>
          <button class="btn btn-vert" type="submit" data-t="js.resultat.voir"></button>
          <p class="petit" data-t="js.resultat.saisie_note"></p>
        </form>
        <p class="resultat-message" id="resultat-message" role="status" hidden></p>
        <div class="resultat-actions">
          <a class="btn btn-vert" href="/connexion" data-connexion id="btn-affiner"><span data-t="js.resultat.affiner"></span> <span class="fleche" aria-hidden="true">→</span></a>
          <button class="lien" type="button" id="btn-autre" data-t="js.resultat.autre"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. Histoire : comprendre. L'établi et le trousseau (public/js/landing/histoire.js) : scène collante pilotée par
       le défilement sur ordinateur, trois panneaux sur téléphone, tablette et en mouvement réduit. -->
  <section id="histoire" class="nuit histoire" aria-labelledby="titre-histoire">
    <div class="histoire-collant">
      <div class="histoire-temps histoire-temps-1">
        <div class="histoire-visuel" aria-hidden="true"></div>
        <div class="histoire-texte">
          <p class="surtitre" data-t="histoire.temps1.surtitre"></p>
          <h2 id="titre-histoire" data-t="histoire.temps1.titre"></h2>
          <p class="chapo" data-t="histoire.temps1.texte"></p>
        </div>
      </div>
      <div class="histoire-temps histoire-temps-2">
        <div class="histoire-visuel" aria-hidden="true"></div>
        <div class="histoire-texte">
          <p class="surtitre" data-t="histoire.temps2.surtitre"></p>
          <h3 class="titre-section" data-t="histoire.temps2.titre"></h3>
          <p class="chapo" data-t="histoire.temps2.texte"></p>
        </div>
        <ol class="visuellement-cache">
          <li><span data-t="histoire.chapitres.0.numero"></span> <span data-t="histoire.chapitres.0.titre"></span> : <span data-t="histoire.chapitres.0.detail"></span></li>
          <li><span data-t="histoire.chapitres.1.numero"></span> <span data-t="histoire.chapitres.1.titre"></span> : <span data-t="histoire.chapitres.1.detail"></span></li>
          <li><span data-t="histoire.chapitres.2.numero"></span> <span data-t="histoire.chapitres.2.titre"></span> : <span data-t="histoire.chapitres.2.detail"></span></li>
          <li><span data-t="histoire.chapitres.3.numero"></span> <span data-t="histoire.chapitres.3.titre"></span> : <span data-t="histoire.chapitres.3.detail"></span></li>
          <li><span data-t="histoire.chapitres.4.numero"></span> <span data-t="histoire.chapitres.4.titre"></span> : <span data-t="histoire.chapitres.4.detail"></span></li>
          <li><span data-t="histoire.chapitres.5.numero"></span> <span data-t="histoire.chapitres.5.titre"></span> : <span data-t="histoire.chapitres.5.detail"></span></li>
          <li><span data-t="histoire.chapitres.6.numero"></span> <span data-t="histoire.chapitres.6.titre"></span> : <span data-t="histoire.chapitres.6.detail"></span></li>
          <li><span data-t="histoire.chapitres.7.numero"></span> <span data-t="histoire.chapitres.7.titre"></span> : <span data-t="histoire.chapitres.7.detail"></span></li>
          <li><span data-t="histoire.chapitres.8.numero"></span> <span data-t="histoire.chapitres.8.titre"></span> : <span data-t="histoire.chapitres.8.detail"></span></li>
        </ol>
      </div>
      <div class="histoire-temps histoire-temps-3">
        <div class="histoire-visuel" aria-hidden="true"></div>
        <div class="histoire-texte">
          <p class="surtitre" data-t="histoire.temps3.surtitre"></p>
          <h3 class="titre-section" data-t="histoire.temps3.titre"></h3>
          <p class="chapo" data-t="histoire.temps3.texte"></p>
        </div>
      </div>
      <div class="histoire-progression" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- 3. Comment ça marche (fusion avec « La boîte à outils ») -->
  <section id="comment" aria-labelledby="titre-comment">
    <div class="conteneur">
      <div class="entete-section">
        <p class="surtitre" data-t="comment.surtitre"></p>
        <h2 id="titre-comment" data-t="comment.titre"></h2>
      </div>
      <ol class="etapes-simples">
        <li>
          <span class="etape-numero" data-t="comment.etapes.0.numero"></span>
          <h3 data-t="comment.etapes.0.titre"></h3>
          <span class="badge" data-t="comment.etapes.0.badge"></span>
          <p data-t="comment.etapes.0.texte"></p>
        </li>
        <li>
          <span class="etape-numero" data-t="comment.etapes.1.numero"></span>
          <h3 data-t="comment.etapes.1.titre"></h3>
          <span class="badge" data-t="comment.etapes.1.badge"></span>
          <p data-t="comment.etapes.1.texte"></p>
        </li>
        <li>
          <span class="etape-numero" data-t="comment.etapes.2.numero"></span>
          <h3 data-t="comment.etapes.2.titre"></h3>
          <span class="badge" data-t="comment.etapes.2.badge"></span>
          <p data-t="comment.etapes.2.texte"></p>
        </li>
      </ol>
      <p class="outils-ligne" data-t="comment.outils"></p>
    </div>
  </section>

  <!-- 4. Et la vôtre ? (démo du nom de code en phase 6) -->
  <section id="essai" class="essai" aria-labelledby="titre-essai">
    <div class="conteneur">
      <p class="surtitre" data-t="essai.surtitre"></p>
      <h2 id="titre-essai" data-t="essai.titre"></h2>
      <p class="chapo" data-t="essai.texte"></p>
      <p class="essai-action"><button class="btn btn-contour" type="button" data-focus-champ data-t="essai.bouton"></button></p>
    </div>
  </section>

  <!-- 5. Confidentialité : se rassurer -->
  <section id="confidentialite" class="nuit" aria-labelledby="titre-confid">
    <div class="conteneur confid-grille">
      <div>
        <p class="surtitre" data-t="confidentialite.surtitre"></p>
        <h2 id="titre-confid" data-t="confidentialite.titre"></h2>
        <p class="chapo" data-t="confidentialite.texte"></p>
        <p class="confid-hebergement" data-si="hebergement" data-t="confidentialite.hebergement"></p>
        <p class="confid-lien"><a class="btn btn-sable" href="/confidentialite" data-t="confidentialite.politique"></a></p>
      </div>
      <div class="garanties">
        <div class="garantie">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <h3 data-t="confidentialite.garanties.0.titre"></h3><p data-t="confidentialite.garanties.0.texte"></p>
        </div>
        <div class="garantie">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
          <h3 data-t="confidentialite.garanties.1.titre"></h3><p data-t="confidentialite.garanties.1.texte"></p>
        </div>
        <div class="garantie">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <h3 data-t="confidentialite.garanties.2.titre"></h3><p data-t="confidentialite.garanties.2.texte"></p>
        </div>
        <div class="garantie">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          <h3 data-t="confidentialite.garanties.3.titre"></h3><p data-t="confidentialite.garanties.3.texte"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 6. Tarifs (retirée tant que le prix du dossier n'est pas fourni) -->
  <section id="tarifs" class="tarifs" aria-labelledby="titre-tarifs" data-si="prix_dossier">
    <div class="conteneur">
      <div class="entete-section">
        <p class="surtitre" data-t="tarifs.surtitre"></p>
        <h2 id="titre-tarifs" data-t="tarifs.titre"></h2>
      </div>
      <div class="tarifs-grille">
        <div class="carte tarif">
          <h3 data-t="tarifs.estimation_titre"></h3>
          <p class="tarif-prix chiffre" data-t="tarifs.estimation_prix"></p>
          <p data-t="tarifs.estimation_texte"></p>
        </div>
        <div class="carte tarif">
          <h3 data-t="tarifs.dossier_titre"></h3>
          <p class="tarif-prix chiffre" data-t="tarifs.dossier_prix"></p>
          <p data-t="tarifs.dossier_texte"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 7. Parti pris -->
  <section id="parti-pris" class="parti-pris" aria-labelledby="titre-parti-pris">
    <div class="parti-pris-media">
      <img src="/img/photos/hero-poster-1600.webp" srcset="/img/photos/hero-poster-800.webp 800w, /img/photos/hero-poster-1600.webp 1600w, /img/photos/hero-poster-2400.webp 2400w"
           sizes="100vw" loading="lazy" width="2400" height="1266" data-t-attr="alt=parti_pris.video_alt">
      <div class="conteneur parti-pris-texte">
        <p class="surtitre" data-t="parti_pris.surtitre"></p>
        <h2 id="titre-parti-pris" data-t="parti_pris.titre"></h2>
        <p class="chapo" data-t="parti_pris.texte"></p>
      </div>
    </div>
    <div class="conteneur" data-si-un="fondateur_nom fondateur_texte fondateur_photo partenaires">
      <div class="carte fondateur">
        <img class="fondateur-photo" data-si="fondateur_photo" data-t-attr="src=cles.fondateur_photo; alt=parti_pris.fondateur_photo_alt" width="160" height="160" loading="lazy">
        <div>
          <h3 data-si="fondateur_nom" data-t="parti_pris.fondateur"></h3>
          <p data-si="fondateur_texte" data-t="parti_pris.fondateur_texte"></p>
          <div data-si="partenaires">
            <p class="surtitre" data-t="parti_pris.partenaires"></p>
            <ul class="partenaires" data-t-liste="cles.partenaires"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 8. Questions -->
  <section id="questions" aria-labelledby="titre-faq">
    <div class="conteneur faq-grille">
      <div>
        <p class="surtitre" data-t="questions.surtitre"></p>
        <h2 id="titre-faq" data-t="questions.titre"></h2>
      </div>
      <div class="faq">
        <details><summary><span data-t="questions.liste.0.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.0.r"></div></details>
        <details><summary><span data-t="questions.liste.1.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.1.r"></div></details>
        <details><summary><span data-t="questions.liste.2.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.2.r"></div></details>
        <details><summary><span data-t="questions.liste.3.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.3.r"></div></details>
        <details><summary><span data-t="questions.liste.4.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.4.r"></div></details>
        <details><summary><span data-t="questions.liste.5.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.5.r"></div></details>
        <details data-si="prix_dossier"><summary><span data-t="questions.liste.6.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.6.r"></div></details>
        <details><summary><span data-t="questions.liste.7.q"></span><span class="plus" aria-hidden="true">+</span></summary><div class="reponse" data-t="questions.liste.7.r"></div></details>
      </div>
    </div>
  </section>

  <!-- 9. Relance -->
  <section id="relance" class="nuit final relance" aria-labelledby="titre-relance">
    <div class="conteneur">
      <h2 id="titre-relance" data-t="relance.titre"></h2>
      <form class="recherche relance-champ" action="/connexion" method="get" data-champ-siren="relance" data-zone-champ>
        <div class="recherche-champ">
          <label for="q-relance" data-t="champ.libelle"></label>
          <input id="q-relance" name="q" type="search" autocomplete="off" aria-describedby="note-relance" data-t-attr="placeholder=champ.libelle"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-relance">
          <button class="btn btn-vert" type="submit"><span data-t="champ.bouton"></span> <span class="fleche" aria-hidden="true">→</span></button>
        </div>
        <ul class="suggestions" id="suggestions-relance" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
        <p class="recherche-message" id="message-relance" role="status" data-message hidden></p>
        <p class="relance-note" id="note-relance" data-t="relance.note"></p>
      </form>
    </div>
  </section>
</main>
