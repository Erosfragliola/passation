<main id="contenu">

  <!-- 1. Hero : agir -->
  <section id="accueil" class="hero hero-v5" aria-labelledby="titre-hero">
    <!-- Accueil v5 (18/11/2026) : la vidéo dans une grande forme non rectangulaire (angles asymétriques, encoche en bas
         découpée autour des deux bulles de droite ; les deux bulles de gauche sont posées par-dessus, avec une ombre),
         le texte à l'intérieur
         (public/js/landing/forme-hero.js) -->
    <div class="hero-scene" id="hero-scene">
      <div class="hero-fond">
      <img src="/img/photos/hero-poster-1600.webp"
           srcset="/img/photos/hero-poster-800.webp 800w, /img/photos/hero-poster-1600.webp 1600w, /img/photos/hero-poster-2400.webp 2400w"
           sizes="100vw" alt="" width="2400" height="1266" fetchpriority="high">
      <!-- Vidéo (public/js/landing/video.js) : 1080p, 2160p seulement à partir de 1 600 px de large ; clips des métiers
           en alternance si la liste est fournie (second lecteur créé à ce moment) ; jamais avec « réduire les
           animations » ni en économie de données (l'image reste) -->
      <div class="hero-videos" data-sources-hd='[["/video/hero-1080.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'
           data-sources-uhd='[["/video/hero-2160.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'>
        <video class="hero-video" muted playsinline preload="metadata" aria-hidden="true" hidden></video>
      </div>
    </div>

        <button class="hero-pause" type="button" hidden>

          <svg class="icone-lecture" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3l10 6-10 6z" fill="currentColor"/></svg>
          <span class="visuellement-cache"></span>
        </button>
      </div>
      <div class="conteneur hero-contenu">
        <p class="surtitre" data-t="hero.surtitre"></p>

        <p class="chapo" data-t="hero.sous_titre"></p>
        <form class="recherche" action="/connexion" method="get" role="search" data-champ-siren="accueil" data-t-attr="aria-label=champ.zone">

            <label for="q" data-t="champ.libelle"></label>
            <input id="q" name="q" type="search" autocomplete="off" required minlength="3" aria-describedby="note-recherche"

                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
            <button class="btn btn-vert" type="submit"><span data-t="champ.bouton"></span> <span class="fleche" aria-hidden="true">→</span></button>

          <ul class="suggestions" id="suggestions" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
          <p class="recherche-message" id="recherche-message" role="status" data-message hidden></p>
          <div class="recherche-note" id="note-recherche">
            <ul class="hero-coches">
              <li data-t="hero.coches.0"></li><li data-t="hero.coches.1"></li><li data-t="hero.coches.2"></li>

            <p data-t="hero.note_comptes"></p>

  <div class="sources-bande" data-t-attr="aria-label=pourquoi.sources">

  <!-- Résultat de l'estimation (public/js/landing/resultat.js) : l'analyse en quatre étapes (inchangée), puis une fiche
       de synthèse (lot 1) : nom de code, fourchette et barre bas / central / haut, sources datées, une seule action.
       Aucun compte n'est demandé avant de voir la valeur. -->
  <section id="resultat" class="resultat" aria-labelledby="titre-resultat" hidden>
    <div class="carte-large carte-verte nuit resultat-grille">
      <div class="resultat-texte" aria-live="polite">
        <div class="resultat-chargement" hidden>
          <ol class="analyse-etapes" aria-hidden="true">
            <li><i></i><span data-t="js.analyse.0"></span></li>
            <li><i></i><span data-t="js.analyse.1"></span></li>
            <li><i></i><span data-t="js.analyse.2"></span></li>
            <li><i></i><span data-t="js.analyse.3"></span></li>
          </ol>
          <p class="resultat-chargement-texte" data-t="js.chargement"></p>
        </div>
        <div class="resultat-contenu fiche fiche-repreneur" hidden>
          <!-- Fiche « repreneur » (19/11/2026) : à gauche le profil anonyme tel qu'il circulera, sous nom de code et tampon ;
               à droite la fourchette, visible du seul dirigeant ; en bas les sources et une seule action. -->
          <div class="fiche-profil">
            <span class="fiche-tampon" aria-hidden="true" data-t="js.resultat.tampon"></span>
            <p class="fiche-profil-eti" data-t="js.resultat.code_intro"></p>
            <h2 id="titre-resultat"><em class="resultat-code"></em></h2>
            <dl class="fiche-profil-liste">
              <div id="profil-secteur"><dt data-t="js.resultat.profil.secteur"></dt><dd></dd></div>
              <div id="profil-region"><dt data-t="js.resultat.profil.region"></dt><dd></dd></div>
              <div id="profil-anciennete"><dt data-t="js.resultat.profil.anciennete"></dt><dd></dd></div>
              <div id="profil-effectif"><dt data-t="js.resultat.profil.effectif"></dt><dd></dd></div>
            </dl>
            <p class="fiche-profil-note" data-t="js.resultat.profil_note"></p>
          </div>
          <div class="fiche-valeur">
            <p class="fiche-prive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-t="js.resultat.prive"></span></p>
            <div class="resultat-valeur" id="resultat-estimation">
              <p class="resultat-libelle" data-t="js.resultat.fourchette_titre"></p>
              <p class="estimation-valeur chiffre" id="estimation-valeur"></p>
              <ul class="resultat-methodes" id="estimation-methodes"></ul>
              <p class="resultat-note" id="estimation-note"></p>
            </div>
            <form id="form-comptes" class="form-comptes" hidden>
              <p data-t="js.resultat.confidentiels"></p>
              <label><span data-t="js.resultat.ca"></span><input id="saisie-ca" type="number" inputmode="numeric" min="1" step="1" required></label>
              <label><span data-t="js.resultat.ebe"></span><input id="saisie-ebe" type="number" inputmode="numeric" step="1" required></label>
              <button class="btn btn-vert" type="submit" data-t="js.resultat.voir"></button>
              <p class="petit" data-t="js.resultat.saisie_note"></p>
            </form>
          </div>
          <div class="fiche-pied">
            <p class="fiche-sources" id="resultat-sources" hidden></p>
            <div class="fiche-action">
              <a class="btn btn-vert" id="resultat-ouvrir" href="/connexion" data-connexion><span data-t="js.resultat.dossier_bouton"></span> <span class="fleche" aria-hidden="true">→</span></a>
              <p data-t="js.resultat.dossier_note"></p>
            </div>
          </div>
          <p class="resultat-message" id="resultat-message" role="status" hidden></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Comment ça marche (lot 1, 18/11/2026) : trois étapes reliées par un trait de progression ; chacune montre ce
       qui se passe (petite scène SVG jouée une fois à l'entrée dans l'écran, public/js/landing/scenes.js ; état final

                <text class="s-valeur" x="32" y="160" data-t="comment.illustrations.siren.valeur"></text>
              </g>
            </svg>
          </div>
          <h3><button class="parcours-ouvrir" type="button" aria-expanded="true" aria-controls="comment-1-detail"><span data-t="comment.etapes.0.titre"></span><span class="parcours-signe" aria-hidden="true"></span></button></h3>
          <div class="parcours-detail" id="comment-1-detail"><div class="parcours-detail-int">
          <p class="etape-description" data-t="comment.etapes.0.texte"></p>
          <p class="parcours-obtenez" data-t="comment.etapes.0.obtenez"></p>
          <ul class="parcours-mentions"><li data-t="comment.etapes.0.pastilles.0"></li><li data-t="comment.etapes.0.pastilles.1"></li></ul>
          </div></div>
        </li>
        <li class="parcours-etape" id="comment-2" data-scene>
          <span class="parcours-noeud" aria-hidden="true">02</span>
          <p class="parcours-chiffre affiche" data-t="comment.etapes.1.chiffre"></p>
          <div class="parcours-scene" aria-hidden="true">
            <svg class="scene-svg scene-chiffres" viewBox="0 0 320 196" focusable="false">
              <text class="s-fictif" x="306" y="20" text-anchor="end" data-t="comment.illustrations.fictif"></text>
              <g class="s-ligne s-l1"><text class="s-poste" x="14" y="44" data-t="comment.illustrations.chiffres.lignes.0.poste"></text><text class="s-montant" x="306" y="44" text-anchor="end" data-t="comment.illustrations.chiffres.lignes.0.montant"></text><path class="s-trait" d="M14 54h292"/></g>
              <g class="s-ligne s-l2"><text class="s-poste" x="14" y="74" data-t="comment.illustrations.chiffres.lignes.1.poste"></text><text class="s-montant" x="306" y="74" text-anchor="end" data-t="comment.illustrations.chiffres.lignes.1.montant"></text><path class="s-trait" d="M14 84h292"/></g>
              <g class="s-ligne s-l3"><text class="s-poste" x="14" y="104" data-t="comment.illustrations.chiffres.lignes.2.poste"></text><text class="s-montant" x="306" y="104" text-anchor="end" data-t="comment.illustrations.chiffres.lignes.2.montant"></text><path class="s-trait" d="M14 114h292"/></g>
              <g class="s-synthese">
