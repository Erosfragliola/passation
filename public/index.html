<body class="landing">
<!-- Intro (première visite) : le seuil du logo se dessine, la porte s'allume, on entre. public/js/landing/intro.js -->

      <mask id="intro-masque" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">

      </mask>
    </defs>
    <rect class="intro-fond" width="100%" height="100%" mask="url(#intro-masque)"/>

      <path class="intro-porte" d="M9 27V15a7 7 0 0 1 14 0v12z" opacity="0"/>
      <path class="intro-trait" d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke-width="1.1" stroke-linecap="round"/>
      <path class="intro-trait" d="M5 27h22" fill="none" stroke-width="1.1" stroke-linecap="round"/>
      <circle class="intro-point" cx="16" cy="21" r="2.4" fill="#A8653A" opacity="0"/>
    </g>
  </svg>
  <span class="intro-nom" aria-hidden="true">Passation</span>
  <button class="intro-passer" type="button"><span data-t="intro.passer"></span> <span aria-hidden="true">›</span></button>
</div>
<a class="lien-evitement" href="#contenu" data-t="nav.evitement">Aller au contenu</a>

<header class="nav-zone">
  <nav class="nav" data-t-attr="aria-label=nav.principale">
    <a class="logo" href="/" data-t-attr="aria-label=nav.accueil"><svg class="logo-symbole" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 27V15a7 7 0 0 1 14 0v12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 27h22" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="21" r="2.6" fill="#A8653A"/></svg>Passation</a>
    <div class="nav-centre">

        <li><a href="#comment" data-t="nav.comment"></a></li>
        <li><a href="#livrables" data-t="nav.livrables"></a></li>

        <li><a href="#questions" data-t="nav.questions"></a></li>
      </ul>
      <form class="nav-champ recherche-mini" action="/connexion" method="get" data-champ-siren="nav" data-zone-champ>
        <label class="visuellement-cache" for="q-nav" data-t="champ.libelle"></label>
        <input id="q-nav" name="q" type="search" autocomplete="off" data-t-attr="placeholder=champ.libelle"

        <button class="btn btn-vert" type="submit"><span data-t="champ.bouton_court"></span> <span class="fleche" aria-hidden="true">→</span></button>
        <ul class="suggestions" id="suggestions-nav" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>

<main id="contenu">

  <!-- 1. Hero : agir -->
  <section id="accueil" class="hero hero-v5" aria-labelledby="titre-hero">
    <!-- Accueil v5 (18/11/2026) : la vidéo dans une grande forme non rectangulaire (angles asymétriques, encoche en bas
         où se loge le champ), le texte à l'intérieur ; trois bulles à cheval sur les bords (public/js/landing/forme-hero.js) -->
    <div class="hero-scene" id="hero-scene">
      <div class="hero-fond">
      <img src="/img/photos/hero-poster-1600.webp"
           srcset="/img/photos/hero-poster-800.webp 800w, /img/photos/hero-poster-1600.webp 1600w, /img/photos/hero-poster-2400.webp 2400w"
           sizes="100vw" alt="" width="2400" height="1266" fetchpriority="high">
      <!-- Vidéo (public/js/landing/video.js) : 1080p, 2160p seulement à partir de 1 600 px de large ; clips des métiers
           en alternance si la liste est fournie (second lecteur créé à ce moment) ; jamais avec « réduire les
           animations » ni en économie de données (l'image reste) -->
      <div class="hero-videos" data-sources-hd='[["/video/hero-1080.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'
           data-sources-uhd='[["/video/hero-2160.webm","video/webm"],["/video/hero-1080.mp4","video/mp4"]]'>
        <video class="hero-video" muted playsinline preload="metadata" aria-hidden="true" hidden></video>
      </div>
    </div>
      <div class="hero-bas">
        <p class="hero-metier" aria-hidden="true" hidden></p>
        <button class="hero-pause" type="button" hidden>
          <svg class="icone-pause" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3h3v12H5zM10 3h3v12h-3z" fill="currentColor"/></svg>
          <svg class="icone-lecture" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3l10 6-10 6z" fill="currentColor"/></svg>
          <span class="visuellement-cache"></span>
        </button>
      </div>
      <div class="conteneur hero-contenu">
        <p class="surtitre" data-t="hero.surtitre"></p>
        <h1 id="titre-hero" class="affiche" data-t="hero.titre"></h1>
        <p class="chapo" data-t="hero.sous_titre"></p>
        <form class="recherche" action="/connexion" method="get" role="search" data-champ-siren="accueil" data-t-attr="aria-label=champ.zone">
          <div class="recherche-champ">
            <label for="q" data-t="champ.libelle"></label>
            <input id="q" name="q" type="search" autocomplete="off" required minlength="3" aria-describedby="note-recherche"
                   data-t-attr="placeholder=champ.libelle"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
            <button class="btn btn-vert" type="submit"><span data-t="champ.bouton"></span> <span class="fleche" aria-hidden="true">→</span></button>
          </div>
          <ul class="suggestions" id="suggestions" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
          <p class="recherche-message" id="recherche-message" role="status" data-message hidden></p>
          <div class="recherche-note" id="note-recherche">
            <ul class="hero-coches">
              <li data-t="hero.coches.0"></li><li data-t="hero.coches.1"></li><li data-t="hero.coches.2"></li>
            </ul>
            <p data-t="hero.note_comptes"></p>
          </div>
        </form>
        <ul class="hero-preuves">
          <li data-si="nb_dirigeants" data-t="hero.preuves.dirigeants"></li>
          <li data-si="note_avis nb_avis"><span class="etoiles" aria-hidden="true"><svg viewBox="0 0 90 16" width="90" height="16"><g fill="currentColor"><path id="etoile" d="M8 1l2.1 4.6 5 .5-3.8 3.3 1.1 4.9L8 11.8 3.6 14.3l1.1-4.9L.9 6.1l5-.5z"/><use href="#etoile" x="18"/><use href="#etoile" x="36"/><use href="#etoile" x="54"/><use href="#etoile" x="72"/></g></svg></span> <span data-t="hero.preuves.avis"></span></li>
          <li data-t="hero.preuves.registres"></li>
        </ul>
      </div>
      <div class="hero-bulle bulle-hg sombre"><strong class="affiche" data-t="hero.bulles.delai.chiffre"></strong><span data-t="hero.bulles.delai.texte"></span></div>
      <div class="hero-bulle bulle-hd"><span class="bulle-titre"><span data-t="hero.bulles.code.titre"></span><em data-t="hero.bulles.code.fictif"></em></span><span class="bulle-code" data-t="hero.bulles.code.code"></span><strong class="affiche bulle-valeur" data-t="hero.bulles.code.valeur"></strong></div>
      <div class="hero-bulle bulle-bd"><ul class="bulle-docs"><li data-t="hero.bulles.docs.0"></li><li data-t="hero.bulles.docs.1"></li><li data-t="hero.bulles.docs.2"></li><li data-t="hero.bulles.docs.3"></li></ul></div>
    </div>
  </section>

  <div class="sources-bande" data-t-attr="aria-label=pourquoi.sources">
    <span data-t="sources.libelle"></span><b data-t="sources.liste.0"></b><b data-t="sources.liste.1"></b><b data-t="sources.liste.2"></b>
  </div>

  <!-- Résultat de l'estimation (public/js/landing/resultat.js) : nom de code, fourchette, teaser anonyme, deux suites.
       Aucun compte n'est demandé avant de voir la valeur. -->
  <section id="resultat" class="resultat" aria-labelledby="titre-resultat" hidden>
    <div class="carte-large carte-verte nuit resultat-grille">
      <div class="resultat-texte" aria-live="polite">
        <div class="resultat-chargement" hidden>
          <ol class="analyse-etapes" aria-hidden="true">
            <li><i></i><span data-t="js.analyse.0"></span></li>
            <li><i></i><span data-t="js.analyse.1"></span></li>
            <li><i></i><span data-t="js.analyse.2"></span></li>
            <li><i></i><span data-t="js.analyse.3"></span></li>
          </ol>
          <p class="resultat-chargement-texte" data-t="js.chargement"></p>
        </div>
        <div class="resultat-contenu" hidden>
          <p class="surtitre" data-t="js.resultat.titre"></p>
          <h2 id="titre-resultat"><span class="resultat-code-intro" data-t="js.resultat.code_intro"></span> <em class="resultat-code"></em></h2>
          <p class="visuellement-cache" id="resultat-teaser"></p>
          <div class="resultat-valeur" id="resultat-estimation">
            <p class="resultat-libelle" data-t="js.resultat.fourchette_titre"></p>
            <p class="estimation-valeur chiffre" id="estimation-valeur"></p>
            <ul class="resultat-methodes" id="estimation-methodes"></ul>
            <p class="resultat-note" id="estimation-note"></p>
          </div>
          <form id="form-comptes" class="form-comptes" hidden>
            <p data-t="js.resultat.confidentiels"></p>
            <label><span data-t="js.resultat.ca"></span><input id="saisie-ca" type="number" inputmode="numeric" min="1" step="1" required></label>
            <label><span data-t="js.resultat.ebe"></span><input id="saisie-ebe" type="number" inputmode="numeric" step="1" required></label>
            <button class="btn btn-vert" type="submit" data-t="js.resultat.voir"></button>
            <p class="petit" data-t="js.resultat.saisie_note"></p>
          </form>
          <p class="resultat-message" id="resultat-message" role="status" hidden></p>
        </div>
      </div>
      <div class="resultat-dossier"></div>
    </div>
  </section>

  <!-- 2. Le dossier, en trois blocs (bento du 18/11/2026) -->
  <section id="livrables" class="bloc dossier" aria-labelledby="titre-dossier">
    <div class="conteneur">
      <h2 id="titre-dossier" class="affiche" data-t="dossier.titre"></h2>
      <p class="chapo" data-t="dossier.texte"></p>
      <div class="bento">
        <article class="bento-bloc bento-documents">
          <img class="bento-photo" src="/img/photos/etape-artisane-1600.webp" srcset="/img/photos/etape-artisane-800.webp 800w, /img/photos/etape-artisane-1600.webp 1600w" sizes="(min-width: 1024px) 700px, 100vw" data-t-attr="alt=dossier.documents.photo_alt" width="1600" height="900" loading="lazy">
          <div class="bento-panneau">
            <h3 class="affiche" data-t="dossier.documents.titre"></h3>
            <p data-t="dossier.documents.texte"></p>
            <ul class="bento-pilules"><li data-t="dossier.documents.pilules.0"></li><li data-t="dossier.documents.pilules.1"></li><li data-t="dossier.documents.pilules.2"></li></ul>
          </div>
        </article>
        <article class="bento-bloc bento-methodes">
          <p class="bento-chiffre affiche" aria-hidden="true" data-t="dossier.methodes.chiffre"></p>
          <h3><span class="visuellement-cache" data-t="dossier.methodes.chiffre"></span> <span data-t="dossier.methodes.titre"></span></h3>
          <p data-t="dossier.methodes.texte"></p>
        </article>
        <article class="bento-bloc bento-liste">
          <div>
            <ul class="liste-dossier" data-t-attr="aria-label=dossier.liste.alt">
              <li class="fait" data-t="dossier.liste.etapes.0"></li>
              <li class="fait" data-t="dossier.liste.etapes.1"></li>
              <li class="fait" data-t="dossier.liste.etapes.2"></li>
              <li data-t="dossier.liste.etapes.3"></li>
            </ul>
            <p class="liste-legende" data-t="dossier.liste.legende"></p>
          </div>
        </article>
      </div>
    </div>
  </section>

  <!-- 3. Comment ça marche : trois étapes, grands numéros. Les liens #comment-1, -2, -3 mènent à chaque étape. -->
  <section id="comment" class="bloc comment" aria-labelledby="titre-comment">
    <div class="conteneur">
      <h2 id="titre-comment" class="affiche" data-t="comment.titre"></h2>
      <ol class="etapes-simples">
        <li class="comment-etape" id="comment-1">
          <span class="etape-numero" aria-hidden="true">01</span>
          <p class="etape-surtitre" data-t="comment.etapes.0.surtitre"></p>
          <h3 data-t="comment.etapes.0.titre"></h3>
          <p class="etape-description" data-t="comment.etapes.0.texte"></p>
          <ul class="pastilles"><li data-t="comment.etapes.0.pastilles.0"></li><li data-t="comment.etapes.0.pastilles.1"></li></ul>
        </li>
        <li class="comment-etape" id="comment-2">
          <span class="etape-numero" aria-hidden="true">02</span>
          <p class="etape-surtitre" data-t="comment.etapes.1.surtitre"></p>
          <h3 data-t="comment.etapes.1.titre"></h3>
          <p class="etape-description" data-t="comment.etapes.1.texte"></p>
          <ul class="pastilles">
            <li data-si="duree_etape2" data-t="comment.etapes.1.pastilles.0"></li>
            <li data-si="prix_etape2" data-t="comment.etapes.1.pastilles.1"></li>
          </ul>
        </li>
        <li class="comment-etape" id="comment-3">
          <span class="etape-numero" aria-hidden="true">03</span>
          <p class="etape-surtitre" data-t="comment.etapes.2.surtitre"></p>
          <h3 data-t="comment.etapes.2.titre"></h3>
          <p class="etape-description" data-t="comment.etapes.2.texte"></p>
          <ul class="pastilles">
            <li data-t="comment.etapes.2.pastilles.0"></li>
            <li data-si="prix_dossier" data-t="comment.etapes.2.pastilles.1"></li>
          </ul>
        </li>
      </ol>
    </div>
  </section>

  <!-- 4. Confidentialité : un seul bloc vert, le nom de l'entreprise (fictive) devient un nom de code -->
  <section id="confidentialite" class="bloc confid" aria-labelledby="titre-confid">
    <div class="conteneur">
      <div class="confid-bloc">
        <div>
          <h2 id="titre-confid" class="affiche" data-t="confidentialite.titre"></h2>
          <p class="chapo" data-t="confidentialite.texte"></p>
          <a class="btn btn-creme" href="/confidentialite" data-t="confidentialite.politique"></a>
        </div>
        <div class="confid-masque" role="img" data-t-attr="aria-label=confidentialite.exemple_alt">
          <span class="confid-avant" aria-hidden="true" data-t="confidentialite.avant"></span>
          <span class="confid-apres" aria-hidden="true" data-t="confidentialite.apres"></span>
          <p class="confid-fictif" data-t="confidentialite.fictif"></p>
        </div>
        <ul class="confid-garanties">
          <li><strong data-t="confidentialite.garanties.0.titre"></strong><span data-t="confidentialite.garanties.0.texte"></span></li>
          <li><strong data-t="confidentialite.garanties.1.titre"></strong><span data-t="confidentialite.garanties.1.texte"></span></li>
          <li><strong data-t="confidentialite.garanties.2.titre"></strong><span data-t="confidentialite.garanties.2.texte"></span></li>
          <li><strong data-t="confidentialite.garanties.3.titre"></strong><span data-t="confidentialite.garanties.3.texte"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- 6. Derrière Passation : retirée tant que le nom et le texte du fondateur manquent -->
  <section id="equipe" class="bloc equipe" aria-labelledby="titre-equipe" data-si="fondateur_nom fondateur_texte">
    <div class="conteneur equipe-grille">
      <div class="equipe-texte">
        <p class="surtitre etiquette-kraft" data-t="equipe.surtitre"></p>
        <h2 id="titre-equipe" data-t="equipe.titre"></h2>
        <p class="chapo" data-t="equipe.texte"></p>
        <blockquote class="equipe-citation"><p data-t="equipe.citation"></p></blockquote>
        <p class="signature"><strong data-t="equipe.nom"></strong><span data-si="fondateur_titre" data-t="equipe.fonction"></span></p>
        <div class="equipe-actions" data-si-un="rappel telephone">
          <a class="btn btn-vert" data-si="rappel email_contact" data-t="equipe.rappel" data-t-attr="href=equipe.rappel_lien"></a>
          <a class="btn btn-secondaire" data-si="telephone" data-t="equipe.telephone" data-t-attr="href=pied.telephone_lien; aria-label=equipe.telephone_aria"></a>
        </div>
      </div>
      <img class="equipe-photo" data-si="fondateur_photo" data-t-attr="src=cles.fondateur_photo; alt=equipe.photo_alt" width="640" height="800" loading="lazy">
    </div>
  </section>

  <!-- 7. Ils l'ont fait : retirée tant que deux témoignages au moins ne sont pas fournis -->
  <section id="preuves" class="bloc-carte" aria-labelledby="titre-preuves" data-si="temoignages:2">
    <div class="carte-large carte-sable">
      <p class="surtitre etiquette-kraft" data-t="preuves.surtitre"></p>
      <h2 id="titre-preuves" data-t="preuves.titre"></h2>
      <dl class="preuves-chiffres">
        <div data-si="chiffres.entreprises_estimees"><dt data-t="preuves.entreprises_libelle"></dt><dd data-t="preuves.entreprises"></dd></div>
        <div data-si="note_avis nb_avis"><dt data-t="preuves.note_libelle"></dt><dd data-t="preuves.note"></dd></div>
        <div data-si="chiffres.dossiers_prepares"><dt data-t="preuves.dossiers_libelle"></dt><dd data-t="preuves.dossiers"></dd></div>
        <div><dt data-t="preuves.methodes_libelle"></dt><dd data-t="preuves.methodes"></dd></div>
      </dl>
      <div class="temoignages">
        <figure class="temoignage carte-claire">
          <blockquote data-t="cles.temoignages.0.texte"></blockquote>
          <figcaption data-t="preuves.legendes.0"></figcaption>
        </figure>
        <figure class="temoignage carte-claire">
          <blockquote data-t="cles.temoignages.1.texte"></blockquote>
          <figcaption data-t="preuves.legendes.1"></figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- 8. Guides : retirée (avec le lien de l'en-tête) tant que trois guides ne sont pas fournis -->
  <section id="guides" class="bloc guides" aria-labelledby="titre-guides" data-si="guides:3">
    <div class="conteneur">
      <p class="surtitre etiquette-kraft" data-t="guides.surtitre"></p>
      <h2 id="titre-guides" data-t="guides.titre"></h2>
      <div class="guides-cartes">
        <a class="carte-guide" data-t-attr="href=cles.guides.0.url">
          <span class="guide-visuel"><img data-si="guides.0.image" data-t-attr="src=cles.guides.0.image" alt="" width="640" height="400" loading="lazy"></span>
          <span class="guide-etiquette" data-t="guides.etiquette"></span>
          <span class="guide-titre" data-t="cles.guides.0.titre"></span>
        </a>
        <a class="carte-guide" data-t-attr="href=cles.guides.1.url">
          <span class="guide-visuel"><img data-si="guides.1.image" data-t-attr="src=cles.guides.1.image" alt="" width="640" height="400" loading="lazy"></span>
          <span class="guide-etiquette" data-t="guides.etiquette"></span>
          <span class="guide-titre" data-t="cles.guides.1.titre"></span>
        </a>
        <a class="carte-guide" data-t-attr="href=cles.guides.2.url">
          <span class="guide-visuel"><img data-si="guides.2.image" data-t-attr="src=cles.guides.2.image" alt="" width="640" height="400" loading="lazy"></span>
          <span class="guide-etiquette" data-t="guides.etiquette"></span>
          <span class="guide-titre" data-t="cles.guides.2.titre"></span>
        </a>
      </div>
    </div>
  </section>

  <!-- 9. Questions : natives (details, summary) ; une question sans réponse fournie est retirée -->
  <section id="questions" class="bloc" aria-labelledby="titre-faq">
    <div class="conteneur faq-grille">
      <div>
        <p class="surtitre etiquette-kraft" data-t="questions.surtitre"></p>
        <h2 id="titre-faq" class="affiche" data-t="questions.titre"></h2>
      </div>
      <div class="faq">
        <details data-si="faq_prix"><summary><span data-t="questions.liste.0.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.0.r"></div></details>
        <details><summary><span data-t="questions.liste.1.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.1.r"></div></details>
        <details><summary><span data-t="questions.liste.2.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.2.r"></div></details>
        <details data-si="faq_duree"><summary><span data-t="questions.liste.3.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.3.r"></div></details>
        <details><summary><span data-t="questions.liste.4.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.4.r"></div></details>
        <details><summary><span data-t="questions.liste.5.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.5.r"></div></details>
        <details data-si="faq_qui"><summary><span data-t="questions.liste.6.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.6.r"></div></details>
        <details><summary><span data-t="questions.liste.7.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.7.r"></div></details>
        <details><summary><span data-t="questions.liste.8.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.8.r"></div></details>
        <details data-si="faq_repreneur"><summary><span data-t="questions.liste.9.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.9.r"></div></details>
        <details><summary><span data-t="questions.liste.10.q"></span><span class="plus" aria-hidden="true"></span></summary><div class="reponse" data-t="questions.liste.10.r"></div></details>
      </div>
    </div>
  </section>

  <!-- 11. Appel final : carte ocre clair, le champ partagé -->
  <section id="relance" class="bloc-carte relance" aria-labelledby="titre-relance">
    <div class="carte-large carte-relance">
      <h2 id="titre-relance" class="affiche" data-t="relance.titre"></h2>
      <p class="relance-texte" data-t="relance.texte"></p>
      <form class="recherche relance-champ" action="/connexion" method="get" data-champ-siren="relance" data-zone-champ>
        <div class="recherche-champ">
          <label for="q-relance" data-t="champ.libelle"></label>
          <input id="q-relance" name="q" type="search" autocomplete="off" data-t-attr="placeholder=champ.libelle"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-relance">
          <button class="btn btn-vert" type="submit"><span data-t="champ.bouton"></span> <span class="fleche" aria-hidden="true">→</span></button>
        </div>
        <ul class="suggestions" id="suggestions-relance" role="listbox" data-t-attr="aria-label=champ.suggestions" hidden></ul>
        <p class="recherche-message" id="message-relance" role="status" data-message hidden></p>
      </form>
      <p class="relance-telephone" data-si="telephone"><span data-t="relance.telephone"></span> <a data-t="cles.telephone" data-t-attr="href=pied.telephone_lien"></a>.</p>
    </div>
  </section>
</main>
